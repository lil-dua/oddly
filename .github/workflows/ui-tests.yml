# Manual UI tests (T-25): Actions -> UI tests -> Run workflow. Never runs on push/PR because the
# emulator is slow and flaky and the iOS midnight test waits ~70 s of real time.
# The T-19 store screenshot tests skip themselves unless storeShots / ODDLY_SHOTS_DIR is set,
# so the plain commands below match the ones in .claude/CLAUDE.md.
name: UI tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to test
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

jobs:
  android-ui:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 2; done'
            ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-results
          path: |
            androidApp/build/outputs/androidTest-results/**
            androidApp/build/reports/androidTests/**
          retention-days: 7

  ios-ui:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Pick simulator
        id: sim
        run: |
          xcrun simctl list devices available
          NAMES=$(xcrun simctl list devices available | sed -nE 's/^ *(iPhone [^(]*[^( ]) \(.*/\1/p')
          if echo "$NAMES" | grep -qx 'iPhone 17 Pro'; then
            SIM='iPhone 17 Pro'
          else
            SIM=$(echo "$NAMES" | head -n 1)
          fi
          if [ -z "$SIM" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          echo "Using simulator: $SIM"
          echo "name=$SIM" >> "$GITHUB_OUTPUT"
      - name: Run XCUITest
        env:
          SIM: ${{ steps.sim.outputs.name }}
        run: >-
          xcodebuild test
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -destination "platform=iOS Simulator,name=$SIM"
          -only-testing:iosAppUITests
          -resultBundlePath build/ui.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-results
          path: build/ui.xcresult
          retention-days: 7
